name: Bug Report
description: Report a bug to help us improve Nexa
title: '[Bug]: '
labels: ['bug', 'triage']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the following information to help us resolve the issue quickly.

  - type: input
    id: version
    attributes:
      label: Nexa Version
      description: What version of @bereasoftware/nexa are you using?
      placeholder: 'e.g., 1.0.4'
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: What version of Node.js are you using? (Run `node --version`)
      placeholder: 'e.g., 20.18.0'
    validations:
      required: true

  - type: input
    id: typescript-version
    attributes:
      label: TypeScript Version
      description: What version of TypeScript are you using? (Run `tsc --version`)
      placeholder: 'e.g., 5.4.5'
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where are you running Nexa?
      options:
        - Node.js
        - Browser (Chrome)
        - Browser (Firefox)
        - Browser (Safari)
        - Browser (Edge)
        - Deno
        - Bun
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Provide a code snippet that reproduces the bug
      placeholder: |
        ```typescript
        import { createHttpClient } from '@bereasoftware/nexa';

        const client = createHttpClient({ baseURL: 'https://api.example.com' });
        const result = await client.get('/users');
        // Bug occurs here...
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error Output
      description: Include any error messages or stack traces
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I am using the latest version of Nexa
          required: true
        - label: I have included all information needed to reproduce the bug
          required: true
